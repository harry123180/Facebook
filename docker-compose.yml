services:
  db:
    image: postgres:17-alpine
    container_name: facebook_mvp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Taipei
    ports:
      # 刻意用 5433，避開本機既有的 postgresql-x64-17 服務 (5432)
      - "127.0.0.1:5435:5432"
    volumes:
      - fb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fb_pgdata:
    name: facebook_mvp_pgdata
